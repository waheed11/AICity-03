<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI City AR - حسوبي</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
        #question-panel {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 20px;
            border-radius: 15px;
            max-width: 90%;
            text-align: center;
            z-index: 1000;
            display: none;
        }
        #controls {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { background: #45a049; }
        #answer-input { margin-top: 10px; padding: 10px; width: 100%; font-size: 16px; }
    </style>
</head>
<body>
    <div id="controls">
        <button onclick="playQuestion()">🔊 استمع للسؤال</button>
        <button onclick="startVoiceAnswer()">🎤 جاوب بصوتك</button>
    </div>

    <div id="question-panel">
        <h3 id="question-text"></h3>
        <div id="options"></div>
        <input type="text" id="answer-input" placeholder="اكتب إجابتك (أ، ب، ج، د) أو قلها...">
        <button onclick="submitAnswer()">إرسال</button>
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        <!-- Marker for Hiro (test pattern) -->
        <a-marker preset="hiro">
            <!-- Agent Image (Hisouby) -->
            <a-image 
                src="{{ url_for('static', filename='image/hisouby-agent.png') }}" 
                position="0 0 0"
                scale="2 2 2"
                rotation="-90 0 0">
            </a-image>
            
            <!-- Question Board -->
            <a-plane position="0 -1.5 0" rotation="-90 0 0" width="3" height="1.5" color="#333">
                <a-text id="ar-question" value="مرحبا!\nأنا حسوبي" align="center" color="white" wrap-count="30"></a-text>
            </a-plane>
        </a-marker>
        
        <a-camera-static></a-camera-static>
    </a-scene>

    <script>
        let currentQuestion = null;
        let currentOptions = {};
        
        // Load question from URL params
        const params = new URLSearchParams(window.location.search);
        const subject = params.get('subject') || 'ce';
        const lang = params.get('lang') || 'ar';
        const qid = params.get('qid') || '1';
        
        // Question data (will be loaded from API)
        async function loadQuestion() {
            try {
                const response = await fetch(`/get_question?subject=${subject}&lang=${lang}&qid=${qid}`);
                const data = await response.json();
                currentQuestion = data;
                currentOptions = {A: data.A, B: data.B, C: data.C, D: data.D};
                
                document.getElementById('question-text').innerText = data.question;
                document.getElementById('ar-question').setAttribute('value', data.question);
                document.getElementById('question-panel').style.display = 'block';
            } catch(e) {
                console.error('Error loading question:', e);
            }
        }
        
        function playQuestion() {
            if (!currentQuestion) {
                alert('جاري تحميل السؤال...');
                return;
            }
            
            // For MVP, we use Browser Native Text-to-Speech directly to avoid missing MP3 errors
            if ('speechSynthesis' in window) {
                // Cancel any ongoing speech
                window.speechSynthesis.cancel();
                
                const utterance = new SpeechSynthesisUtterance(currentQuestion.question);
                utterance.lang = 'ar-SA'; // Arabic Saudi Arabia
                utterance.rate = 0.9;     // Slightly slower for clarity
                utterance.pitch = 1.0;
                
                window.speechSynthesis.speak(utterance);
            } else {
                alert('عذراً، متصفحك لا يدعم قراءة النص الصوتي.');
            }
        }
        
        function startVoiceAnswer() {
            if (!('webkitSpeechRecognition' in window)) {
                alert('المتصفح لا يدعم التعرف على الصوت');
                return;
            }
            
            const recognition = new webkitSpeechRecognition();
            recognition.lang = 'ar-SA';
            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                document.getElementById('answer-input').value = transcript;
                checkAnswer(transcript);
            };
            recognition.start();
        }
        
        function submitAnswer() {
            const answer = document.getElementById('answer-input').value;
            checkAnswer(answer);
        }
        
        async function checkAnswer(userAnswer) {
            // Simple matching: extract A, B, C, D or أ, ب, ج, د
            const answerMap = {'أ': 'A', 'ب': 'B', 'ج': 'C', 'د': 'D', 'a': 'A', 'b': 'B', 'c': 'C', 'd': 'D'};
            const normalized = userAnswer.trim().toLowerCase();
            const selectedOption = answerMap[normalized] || normalized.toUpperCase();
            
            const isCorrect = selectedOption === currentQuestion.answer;
            
            if (isCorrect) {
                playAudio('correct');
                alert('🎉 إجابة صحيحة!');
            } else {
                playAudio('wrong');
                alert(`❌ خطأ! الإجابة الصحيحة هي: ${currentQuestion.answer}`);
            }
        }
        
        function playAudio(type) {
            const audio = new Audio(`/static/audio/hisouby-${type}.mp3`);
            audio.play().catch(() => {
                // Fallback TTS
                const text = type === 'correct' ? 'إجابة صحيحة! أحسنت!' : 'للأسف، الإجابة خاطئة';
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ar-SA';
                speechSynthesis.speak(utterance);
            });
        }
        
        // Load question on page load
        window.onload = loadQuestion;
    </script>
</body>
</html>
